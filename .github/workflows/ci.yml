name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test without Discord credentials
        run: python -m unittest discover -s tests -q
      - name: Build the Docker image
        run: docker build --tag reshuffle-ci:${{ github.sha }} .
      - name: Check imports as the image user without network or data
        run: >-
          docker run --rm --network none --entrypoint python reshuffle-ci:${{ github.sha }}
          -c 'import discord; import bookclub.ui; import bookclub.runtime_health; print("Image imports OK")'
