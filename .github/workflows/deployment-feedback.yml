name: Deployment feedback
run-name: Deployment feedback (${{ github.event.inputs.mode || 'observe' }})

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Observe production or test diagnostics with an isolated failing build
        type: choice
        options: [observe, self-test]
        default: observe

permissions:
  contents: read
  deployments: write

concurrency:
  group: feedback-${{ github.event.workflow_run.head_sha || github.sha }}-${{ inputs.mode || 'observe' }}
  cancel-in-progress: false

jobs:
  observe:
    name: Server deployment result and diagnostics
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Always execute trusted default-branch code, never PR artifacts or PR code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe deployment and publish status
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_FEEDBACK_HOST: ${{ secrets.DEPLOY_FEEDBACK_HOST }}
          DEPLOY_FEEDBACK_KEY: ${{ secrets.DEPLOY_FEEDBACK_KEY }}
          DEPLOY_FEEDBACK_KNOWN_HOSTS: ${{ secrets.DEPLOY_FEEDBACK_KNOWN_HOSTS }}
        run: python3 ops/github_deployment_observer.py
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-feedback/
          retention-days: 30
          if-no-files-found: warn
